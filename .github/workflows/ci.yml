name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  cargo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Run cargo test
        env:
          RUSTC_WRAPPER: ""
        run: cargo test --locked --lib --bins --tests --examples

      - name: Run cargo clippy
        env:
          RUSTC_WRAPPER: ""
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Verify Landlock scopes, TCP rules, rule aliases and capability readback
        env:
          RUSTC_WRAPPER: ""
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
        run: |
          cargo test --locked --lib security::landlock_policy::tests::kernel_enforces_tcp_and_ipc_scopes -- --ignored --exact
          cargo test --locked --lib security::landlock_policy::tests::production_checks_bind_aliases_on_installed_rule_fds -- --ignored --exact
          cargo test --locked --lib security::capabilities::tests::custom_capability_sets_are_enforced_by_kernel -- --ignored --exact

      - name: Verify host-root artifact ownership and hook credentials
        env:
          RUSTC_WRAPPER: ""
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
        run: |
          cargo test --locked --lib container::runtime::tests::host_root_rejects_foreign_bundle_and_artifact_paths -- --ignored --exact
          cargo test --locked --lib oci::tests::hook_receives_state_with_unprivileged_credentials -- --exact

      - name: Verify recursive bind restrictions
        env:
          RUSTC_WRAPPER: ""
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
        run: cargo test --locked --lib filesystem::target::tests::recursive_bind_restricts_nested_mounts -- --ignored --exact

      - name: Install networking test dependencies
        run: sudo apt-get install -y nftables

      - name: Verify bridge isolation, dual-stack egress and restore cgroup inheritance
        env:
          RUSTC_WRAPPER: ""
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
        run: |
          cargo test --locked --lib network::egress::tests::domain_refresh_withdraws_protected_results_and_expires_without_supervisor -- --ignored --exact
          cargo test --locked --lib network::bridge::tests::isolated_bridge_routes_only_intended_traffic -- --ignored --exact
          cargo test --locked --lib network::egress::tests::deny_all_sets_both_kernel_output_policies -- --ignored --exact
          cargo test --locked --lib checkpoint::criu::tests::restore_helper_and_descendants_inherit_limits_and_saved_identity -- --ignored --exact

      - name: Verify root-run workspace isolation
        env:
          RUSTC_WRAPPER: ""
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
        run: cargo test --locked --test integration_filesystem tests::root_agent_bind_mount_uses_unprivileged_host_ids -- --ignored --exact

      - name: Verify native procfs descriptor confinement
        env:
          RUSTC_WRAPPER: ""
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
        run: cargo test --locked --test integration_filesystem tests::native_procfs_exposes_status_but_refuses_descriptor_links -- --ignored --exact

      - name: Verify GPU device ownership as root
        env:
          RUSTC_WRAPPER: ""
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
        run: cargo test --locked --lib filesystem::gpu::tests::gpu_node_ownership_preserves_host_and_allows_non_root_access -- --ignored --exact

      - name: Verify cgroup device filter enforcement as root
        env:
          RUSTC_WRAPPER: ""
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
        run: cargo test --locked --lib resources::cgroup_device::tests::kernel_enforces_device_allowlist -- --ignored --exact

  supply-chain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install cargo-audit and cargo-deny
        env:
          RUSTC_WRAPPER: ""
        run: cargo install --locked cargo-audit cargo-deny

      - name: Run cargo audit
        env:
          RUSTC_WRAPPER: ""
        # RUSTSEC-2026-0543 (chrono unmaintained) is informational and has no
        # fixed release. chrono only reaches us through the dev-only model
        # tracing chain tla-connect -> itf -> serde_with (chrono feature);
        # no production target links it. cargo-audit >= 0.22 has no config
        # file, so the ignore is passed on the CLI. Revisit when itf or
        # serde_with drop chrono.
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0543

      - name: Run cargo deny
        env:
          RUSTC_WRAPPER: ""
        run: cargo deny check advisories bans sources
