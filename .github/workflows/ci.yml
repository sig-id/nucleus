name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  cargo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Run cargo test
        env:
          RUSTC_WRAPPER: ""
        run: cargo test --locked --lib --bins --tests --examples

      - name: Run cargo clippy
        env:
          RUSTC_WRAPPER: ""
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Verify root-run workspace isolation
        env:
          RUSTC_WRAPPER: ""
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
        run: cargo test --locked --test integration_filesystem tests::root_agent_bind_mount_uses_unprivileged_host_ids -- --ignored --exact

      - name: Verify GPU device ownership as root
        env:
          RUSTC_WRAPPER: ""
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
        run: cargo test --locked --lib filesystem::gpu::tests::gpu_node_ownership_preserves_host_and_allows_non_root_access -- --ignored --exact

      - name: Verify cgroup device filter enforcement as root
        env:
          RUSTC_WRAPPER: ""
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
        run: cargo test --locked --lib resources::cgroup_device::tests::kernel_enforces_device_allowlist -- --ignored --exact

  supply-chain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install cargo-audit and cargo-deny
        env:
          RUSTC_WRAPPER: ""
        run: cargo install --locked cargo-audit cargo-deny

      - name: Run cargo audit
        env:
          RUSTC_WRAPPER: ""
        run: cargo audit --deny warnings

      - name: Run cargo deny
        env:
          RUSTC_WRAPPER: ""
        run: cargo deny check advisories bans sources
